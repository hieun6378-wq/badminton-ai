<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Badminton AI — Smash Speed</title><style>
*{box-sizing:border-box}body{margin:0;background:#06110e;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:1180px;margin:auto;padding:20px}.hero{padding:18px 0}.hero h1{font-size:clamp(30px,5vw,54px);margin:0}.hero p{color:#9db4ad}.card{background:#10201c;border:1px solid #29443c;border-radius:20px;padding:18px;margin:15px 0}.drop{border:2px dashed #427b6d;border-radius:16px;padding:30px;text-align:center;cursor:pointer}.drop input{display:none}button{background:#25cb8e;color:#06150f;border:0;padding:12px 18px;border-radius:11px;font-weight:800;cursor:pointer}button:disabled{opacity:.45}.actions{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}.bar{height:7px;background:#1f332e;border-radius:10px;margin-top:12px}.fill{height:100%;width:0;background:#25cb8e;border-radius:10px}.notice{margin-top:12px;background:#182d27;padding:11px;border-radius:10px;color:#bdd0c9}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{background:#0a1714;border-radius:13px;padding:16px}.num{font-size:28px;font-weight:900}.muted{color:#9bb0aa}.event{display:flex;justify-content:space-between;gap:15px;align-items:center;border-bottom:1px solid #284039;padding:13px 2px}.event .speed{font-size:22px;font-weight:900}.event button{padding:8px 12px}.review{margin-top:14px;display:none}.review video{width:100%;max-height:600px;background:#000;border-radius:14px}#output{width:100%;max-height:620px;background:#000;border-radius:14px;margin-top:15px} @media(max-width:700px){.wrap{padding:10px}.grid{grid-template-columns:1fr}.event{align-items:flex-start;flex-direction:column}}
</style></head><body><div class="wrap">
<div class="hero"><h1>🏸 BADMINTON AI</h1><p>AI nhận diện VĐV • cầu • pha smash • tốc độ • xem lại từng pha</p></div>
<div class="card"><label class="drop"><input id="file" type="file" accept="video/*"><div style="font-size:44px">🎥</div><h2 id="name">Tải video trận đấu lên</h2><div class="muted">Khuyến nghị 60 / 120 / 240 FPS và camera cố định</div></label>
<div class="actions"><button id="go" disabled>⚡ PHÂN TÍCH AI</button><button id="clear">Xóa</button></div><div class="bar"><div id="fill" class="fill"></div></div><div id="status" class="notice">Chưa có video.</div>
<video id="output" controls playsinline preload="metadata"></video></div>
<div class="card"><h2>Kết quả</h2><div class="grid"><div class="stat"><div class="muted">Smash nhanh nhất</div><div id="max" class="num">--</div></div><div class="stat"><div class="muted">Pha smash</div><div id="count" class="num">0</div></div><div class="stat"><div class="muted">FPS</div><div id="fps" class="num">--</div></div></div><div id="events"></div><div class="review" id="review"><h3>🎬 Xem lại pha smash</h3><video id="reviewVideo" controls playsinline></video></div></div>
</div>
<script>
const $=x=>document.querySelector(x);let selected=null,data=null;
$("#file").onchange=()=>{selected=$("#file").files[0];if(!selected)return;$("#name").textContent=selected.name;$("#go").disabled=false;$("#status").textContent="Video đã sẵn sàng."};
$("#clear").onclick=()=>{selected=null;$("#file").value="";$("#go").disabled=true;$("#output").removeAttribute("src");$("#events").innerHTML="";$("#review").style.display="none";$("#fill").style.width="0";$("#name").textContent="Tải video trận đấu lên"};
$("#go").onclick=()=>{if(!selected)return;$("#go").disabled=true;$("#status").textContent="AI đang chạy trên video…";let fd=new FormData();fd.append("video",selected);let x=new XMLHttpRequest();x.open("POST","/api/analyze");x.upload.onprogress=e=>{if(e.lengthComputable)$("#fill").style.width=(e.loaded/e.total*35)+"%"};x.onload=()=>{try{if(x.status!==200)throw Error("AI server lỗi");data=JSON.parse(x.responseText);$("#fill").style.width="100%";$("#output").pause();$("#output").removeAttribute("src");$("#output").load();$("#output").src=data.video_url+"?t="+Date.now();$("#output").load();$("#max").textContent=data.max_speed_kmh?data.max_speed_kmh.toFixed(1)+" km/h":"--";$("#count").textContent=data.events.length;$("#fps").textContent=data.fps.toFixed(1);renderEvents();$("#status").textContent="Phân tích hoàn tất."}catch(e){$("#status").textContent=e.message}$("#go").disabled=false};x.onerror=()=>{$("#status").textContent="Không kết nối được AI server.";$("#go").disabled=false};x.send(fd)};
function renderEvents(){$("#events").innerHTML=data.events.map((e,i)=>`<div class="event"><div><b>SMASH #${i+1}</b><div class="muted">${e.time.toFixed(2)} giây • độ tin cậy ${(e.confidence*100).toFixed(0)}%</div></div><div><span class="speed">${e.speed_kmh.toFixed(1)} km/h</span> <button onclick="review(${i})">▶ Xem lại</button></div></div>`).join("")||'<div class="notice">Không phát hiện pha smash đủ điều kiện.</div>'}
function review(i){let e=data.events[i];$("#review").style.display="block";$("#reviewVideo").pause();$("#reviewVideo").removeAttribute("src");$("#reviewVideo").load();$("#reviewVideo").src=e.clip_url+"?t="+Date.now();$("#reviewVideo").load();$("#reviewVideo").scrollIntoView({behavior:"smooth",block:"center"});$("#reviewVideo").play().catch(()=>{})}
</script></body></html>
